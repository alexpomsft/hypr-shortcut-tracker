<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Hypr Shortcut Tracker</title>
  <desc id="desc">An illustrative terminal report with synthetic shortcut counts, relative last-used times, and a never-used shortcut marked Learn or Remove.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121c2b"/>
      <stop offset="1" stop-color="#202635"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="540" rx="24" fill="url(#background)"/>
  <g font-family="system-ui, sans-serif">
    <rect x="40" y="32" width="187" height="27" rx="13" fill="#2e3b4d"/>
    <text x="54" y="50" font-size="12" font-weight="600" fill="#adc9ee">OMARCHY / HYPRLAND</text>
    <text x="40" y="108" font-size="38" font-weight="700" fill="#eff5ff">Make room for shortcuts you use.</text>
    <text x="40" y="143" font-size="18" fill="#a8b8ce">Frequency, recency, and unused bindings. On your machine, for your eyes.</text>
  </g>
  <rect x="40" y="178" width="1040" height="292" rx="14" fill="#0b111c" stroke="#354257"/>
  <path d="M54 178H1066Q1080 178 1080 192V218H40V192Q40 178 54 178" fill="#243044"/>
  <circle cx="62" cy="198" r="5" fill="#e07878"/>
  <circle cx="80" cy="198" r="5" fill="#e3be70"/>
  <circle cx="98" cy="198" r="5" fill="#8fbe91"/>
  <text x="472" y="203" font-family="system-ui, sans-serif" font-size="12" fill="#b4c3d8">hypr-shortcuts report</text>
  <g font-family="ui-monospace, monospace" font-size="15">
    <text x="62" y="250" fill="#87caa2">$ hypr-shortcuts report</text>
    <g fill="#8193af" font-size="13" font-weight="600">
      <text x="62" y="287">COUNT</text>
      <text x="140" y="287">SHARE</text>
      <text x="225" y="287">LAST USED</text>
      <text x="330" y="287">COVERAGE</text>
      <text x="450" y="287">REVIEW</text>
      <text x="610" y="287">SHORTCUT / FAMILY</text>
      <text x="845" y="287">ACTION</text>
    </g>
    <path d="M62 300H1058" stroke="#27364d"/>
    <g fill="#d5dfee">
      <text x="62" y="328">512</text><text x="140" y="328">65.8%</text><text x="225" y="328">just now</text>
      <text x="330" y="328">1/1 used</text><text x="610" y="328">SUPER + RETURN</text><text x="845" y="328">Terminal</text>
      <text x="62" y="356">166</text><text x="140" y="356">21.3%</text><text x="225" y="356">2m ago</text>
      <text x="330" y="356">4/10 used</text><text x="610" y="356">workspace-switch</text><text x="845" y="356">Switch to workspace</text>
      <text x="62" y="384">97</text><text x="140" y="384">12.5%</text><text x="225" y="384">1h ago</text>
      <text x="330" y="384">2/4 used</text><text x="610" y="384">window-focus-direction</text><text x="845" y="384">Focus adjacent window</text>
    </g>
    <g fill="#e5bd7d">
      <text x="62" y="412">3</text><text x="140" y="412">0.4%</text><text x="225" y="412">6w ago</text>
      <text x="330" y="412">1/10 used</text><text x="450" y="412">REVIEW</text><text x="610" y="412">workspace-move-window</text><text x="845" y="412">Move to workspace</text>
      <text x="62" y="440">0</text><text x="140" y="440">0.0%</text><text x="225" y="440">NEVER</text>
      <text x="330" y="440">0/12 used</text><text x="450" y="440" font-size="13">LEARN / REMOVE</text><text x="610" y="440">window-resize-keyboard</text><text x="845" y="440">Resize (keyboard)</text>
    </g>
  </g>
  <text x="40" y="508" font-family="system-ui, sans-serif" font-size="14" fill="#adc9ee">LOCAL SQLITE  /  NO DAEMON  /  NO TELEMETRY  /  MIT LICENSE</text>
  <text x="900" y="508" font-family="system-ui, sans-serif" font-size="12" fill="#8193af">SYNTHETIC PREVIEW</text>
</svg>
