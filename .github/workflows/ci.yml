name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / Lua 5.4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Lua for adapter tests
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Lua and shell syntax
        run: |
          luac -p lua/shortcut_tracker.lua
          luac -p tests/test_tracker.lua
          bash -n install uninstall
      - name: Check whitespace
        run: git diff --check
